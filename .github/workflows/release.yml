name: Release

# Runs only for a tag the repository owner pushes deliberately. It is never triggered by a pull
# request, so a fork can never reach a signing credential or publish an artifact.
#
# Publication itself is R01 and still requires explicit authorization. This workflow builds, validates,
# and verifies version agreement; it creates a draft release only, never a published one.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore pinned build tools
        run: dotnet tool restore

      # The tag, the application version, and the installer version must agree before anything is built.
      - name: Verify version agreement
        run: pwsh -NoProfile -File scripts/Test-VersionAgreement.ps1 -Tag "${{ github.ref_name }}"

      - name: Build installer
        run: pwsh -NoProfile -File installer/build-installer.ps1

      - name: Validate installer
        run: pwsh -NoProfile -File installer/Test-Installer.ps1 -MsiPath (Get-Item artifacts/installer/*.msi).FullName

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-installer
          path: artifacts/installer/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item artifacts/installer/*.msi).FullName `
            --draft `
            --title "UseNotch ${{ github.ref_name }}" `
            --notes "Draft release. Publication requires explicit authorization."
