name: Release

# Runs only for a tag the repository owner pushes deliberately. It is never triggered by a pull
# request, so a fork can never reach a signing credential or publish an artifact.
#
# The owner authorized publishing on 2026-09-08, so a tag now produces a visible prerelease rather than
# an invisible draft. A draft is only reachable by accounts with push access, which made the artifact
# undownloadable in practice.
#
# Prerelease, not a full release: the MSI is unsigned and the install matrix has not been run. That
# status is stated in the notes rather than hidden by keeping the release invisible. Promoting a build
# to a full release stays a separate, deliberate decision.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore pinned build tools
        run: dotnet tool restore

      # The tag, the application version, and the installer version must agree before anything is built.
      - name: Verify version agreement
        run: pwsh -NoProfile -File scripts/Test-VersionAgreement.ps1 -Tag "${{ github.ref_name }}"

      - name: Build installer
        run: pwsh -NoProfile -File installer/build-installer.ps1

      - name: Validate installer
        run: pwsh -NoProfile -File installer/Test-Installer.ps1 -MsiPath (Get-Item artifacts/installer/*.msi).FullName

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-installer
          path: artifacts/installer/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Release candidate built from ${{ github.sha }}.

          The MSI is a per-user, self-contained package. It installs under the local application
          data folder, needs no administrator rights and no separately installed .NET runtime,
          rejects a downgrade, and removes its own launch-at-login entry on uninstall. Settings and
          cache are deliberately kept.

          Verified for this build: locked restore, a zero-warning Release build, the full test
          suite, formatting, and the installer structure check.

          Not yet verified, which is why this is a prerelease:

          - The artifact is not signed, so SmartScreen will warn on install. Signing is part of
            release hardening and has not been done.
          - Clean install, upgrade, downgrade, uninstall, and interrupted upgrade have not been run
            in a disposable Windows environment.
          - .NET 8 leaves support on 2026-11-10. Confirm the runtime against the shipping date.

          Install it only if you are comfortable with that.
          "@
          gh release create "${{ github.ref_name }}" (Get-Item artifacts/installer/*.msi).FullName `
            --prerelease `
            --title "UseNotch ${{ github.ref_name }}" `
            --notes $notes
