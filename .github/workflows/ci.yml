name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore UseNotch.sln --locked-mode

      - name: Build
        run: dotnet build UseNotch.sln -c Release --no-restore

      - name: Discover tests
        run: dotnet test UseNotch.sln -c Release --no-build --no-restore --list-tests

      - name: Test
        run: dotnet test UseNotch.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Check formatting
        run: dotnet format UseNotch.sln --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
